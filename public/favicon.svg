<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="plate" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e4e6e0"/><stop offset="1" stop-color="#a9aca5"/></linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#34373a"/><stop offset="1" stop-color="#14161a"/></linearGradient>
  </defs>
  <rect width="64" height="64" rx="14" fill="url(#plate)"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="12.5" fill="none" stroke="#fff" stroke-opacity=".55"/>
  <!-- cassette -->
  <rect x="7" y="15" width="50" height="34" rx="5" fill="url(#body)"/>
  <rect x="12" y="19" width="40" height="17" rx="2.5" fill="#f3ecd5"/>
  <rect x="12" y="31.5" width="40" height="1.6" fill="#c85a2e"/>
