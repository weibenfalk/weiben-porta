  <rect x="15" y="22" width="34" height="10" rx="5" fill="#14161a"/>
  <circle cx="23" cy="27" r="3.6" fill="#f3ecd5"/><circle cx="23" cy="27" r="1.4" fill="#14161a"/>
  <circle cx="41" cy="27" r="3.6" fill="#f3ecd5"/><circle cx="41" cy="27" r="1.4" fill="#14161a"/>
  <!-- bottom of the cassette -->
  <path d="M19 49l3-8h20l3 8z" fill="#2a2d30"/>
  <circle cx="26" cy="45" r="1.3" fill="#8c8e89"/><circle cx="38" cy="45" r="1.3" fill="#8c8e89"/>
  <!-- record lamp -->
  <circle cx="51" cy="42" r="2" fill="#d2362b"/>
</svg>
